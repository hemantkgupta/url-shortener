server:
  port: ${URL_SHORTENER_WRITE_SERVICE_PORT:8082}

spring:
  application:
    name: write-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

write:
  kgs-base-url: ${KGS_BASE_URL:http://localhost:${URL_SHORTENER_KEY_GENERATION_SERVICE_PORT:8081}}
  own-domain: ${OWN_DOMAIN:localhost}
  public-scheme: ${URL_SHORTENER_PUBLIC_SCHEME:}
  security:
    google:
      issuer-uri: ${GOOGLE_ISSUER_URI:https://accounts.google.com}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      audience: ${URL_SHORTENER_AUTH_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace: ${CASSANDRA_KEYSPACE:url_shortener}
    datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    schema-replication-strategy: ${CASSANDRA_SCHEMA_REPLICATION_STRATEGY:SimpleStrategy}
    schema-replication-factor: ${CASSANDRA_SCHEMA_REPLICATION_FACTOR:1}
    schema-reset-on-incompatible-replication: ${CASSANDRA_SCHEMA_RESET_ON_INCOMPATIBLE_REPLICATION:false}
  kafka:
    topic:
      url-created: url.created
      bloom-filter: bloom.filter.populate
  safe-browsing:
    enabled: ${SAFE_BROWSING_ENABLED:false}
    blocklist:
      - malware.example.com
      - phishing.test.org
  cdn:
    # Set to true in production to enable the Cloudflare Cache-Tag purge API.
    # When false (default), the no-op implementation logs purge events without HTTP calls.
    enabled: ${CDN_ENABLED:false}
    cloudflare:
      zone-id: ${CLOUDFLARE_ZONE_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
  rate-limit:
    anonymous-creates-per-hour: ${WRITE_ANON_CREATE_LIMIT_PER_HOUR:30}
    authenticated-creates-per-hour: ${WRITE_AUTH_CREATE_LIMIT_PER_HOUR:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
