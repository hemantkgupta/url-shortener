# =============================================================================
# Secrets — REPLACE ALL VALUES BEFORE DEPLOY
# =============================================================================
# Values must be base64-encoded.  Quick encoding:
#   echo -n 'my-password' | base64
# In production, prefer external-secrets-operator or Vault Agent Injector
# over committing this file to version control.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secrets
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/component: secrets
  annotations:
    # IMPORTANT: REPLACE ALL base64 VALUES BEFORE DEPLOY
    secret-rotation-schedule: "90-days"
type: Opaque
data:
  # ---------------------------------------------------------------------------
  # ScyllaDB credentials
  # echo -n 'cassandra' | base64  →  Y2Fzc2FuZHJh
  # ---------------------------------------------------------------------------
  CASSANDRA_USERNAME: Y2Fzc2FuZHJh        # REPLACE BEFORE DEPLOY — default: cassandra
  CASSANDRA_PASSWORD: Y2Fzc2FuZHJh        # REPLACE BEFORE DEPLOY — default: cassandra

  # ---------------------------------------------------------------------------
  # Redis credentials (if AUTH is enabled)
  # echo -n '' | base64  →  (empty, replace with real password)
  # ---------------------------------------------------------------------------
  REDIS_PASSWORD: UkVQTEFDRV9CRUZPX0RFUExPWQ==  # REPLACE BEFORE DEPLOY

  # ---------------------------------------------------------------------------
  # ClickHouse credentials
  # echo -n 'default' | base64  →  ZGVmYXVsdA==
  # ---------------------------------------------------------------------------
  CLICKHOUSE_PASSWORD: UkVQTEFDRV9CRUZPX0RFUExPWQ==  # REPLACE BEFORE DEPLOY

  # ---------------------------------------------------------------------------
  # etcd credentials (if TLS/auth enabled)
  # ---------------------------------------------------------------------------
  ETCD_USERNAME: ZXRjZA==               # REPLACE BEFORE DEPLOY — default: etcd
  ETCD_PASSWORD: UkVQTEFDRV9CRUZPX0RFUExPWQ==  # REPLACE BEFORE DEPLOY

  # ---------------------------------------------------------------------------
  # Kafka SASL credentials (if SASL_PLAINTEXT enabled in prod)
  # ---------------------------------------------------------------------------
  KAFKA_SASL_USERNAME: a2Fma2E=         # REPLACE BEFORE DEPLOY — default: kafka
  KAFKA_SASL_PASSWORD: UkVQTEFDRV9CRUZPX0RFUExPWQ==  # REPLACE BEFORE DEPLOY

  # ---------------------------------------------------------------------------
  # Application signing / internal tokens
  # Generate: openssl rand -base64 32 | base64
  # ---------------------------------------------------------------------------
  INTERNAL_API_TOKEN: UkVQTEFDRV9CRUZPX0RFUExPWQ==  # REPLACE BEFORE DEPLOY
