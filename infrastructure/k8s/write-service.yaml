---
# =============================================================================
# Write Service — URL creation, validation, and persistence
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: write-service
  namespace: url-shortener
  labels:
    app: write-service
    app.kubernetes.io/name: write-service
    app.kubernetes.io/component: write
    app.kubernetes.io/version: "1.0.0-SNAPSHOT"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: write-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: write-service
        app.kubernetes.io/name: write-service
        app.kubernetes.io/version: "1.0.0-SNAPSHOT"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: write-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: write-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: write-service
          image: url-shortener/write-service:1.0.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: url-shortener-config
            - secretRef:
                name: url-shortener-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: write-service
            - name: SERVER_PORT
              value: "8082"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JAVA_OPTS
              value: >-
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=50
                -XX:+ExitOnOutOfMemoryError
                -Djava.security.egd=file:/dev/./urandom
                -Dserver.port=8082
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: write-service
  namespace: url-shortener
  labels:
    app: write-service
    app.kubernetes.io/name: write-service
    app.kubernetes.io/component: write
spec:
  type: ClusterIP
  selector:
    app: write-service
  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: 8082
  sessionAffinity: None
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: write-service-hpa
  namespace: url-shortener
  labels:
    app: write-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: write-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
