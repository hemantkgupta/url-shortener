# =============================================================================
# nginx.conf — URL Shortener Frontend / API Gateway
# =============================================================================
# Responsibilities:
#   1. Serve the React SPA from /usr/share/nginx/html with SPA fallback
#   2. Proxy /v1/* → write-service:8082          (URL creation API)
#   3. Proxy /api/analytics/* → analytics-service:8083 (analytics API)
#   4. Proxy /{shortKey} → redirect-service:8080 (short URL resolution)
#   5. Enable gzip compression
# =============================================================================

# Increase worker connections for high-concurrency scenarios
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    limit_req_status 429;

    # Edge abuse controls for public write endpoints.
    limit_req_zone $binary_remote_addr zone=write_api_per_ip:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=write_api_conn:10m;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ---------------------------------------------------------------------------
    # Performance
    # ---------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ---------------------------------------------------------------------------
    # Upstream definitions
    # ---------------------------------------------------------------------------
    upstream write_service {
        server write-service:8082;
        keepalive 32;
    }

    upstream redirect_service {
        server redirect-service:8080;
        keepalive 64;
    }

    upstream analytics_service {
        server analytics-service:8083;
        keepalive 16;
    }

    # ---------------------------------------------------------------------------
    # Server block
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Health check endpoint (used by Docker/K8s probes)
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # -----------------------------------------------------------------
        # Write API — URL shortening (POST /v1/urls, etc.)
        # -----------------------------------------------------------------
        location /api/write/ {
            limit_req          zone=write_api_per_ip burst=10 nodelay;
            limit_conn         write_api_conn 10;
            proxy_pass         http://write_service/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # -----------------------------------------------------------------
        # Analytics API
        # -----------------------------------------------------------------
        location /api/analytics/ {
            proxy_pass         http://analytics_service/;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
        }

        # -----------------------------------------------------------------
        # Local dev redirect prefix — /r/{shortKey}
        # Strip /r so redirect-service still receives /{shortKey}.
        # -----------------------------------------------------------------
        location /r/ {
            rewrite            ^/r/(.*)$ /$1 break;
            proxy_pass         http://redirect_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_redirect     off;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        # -----------------------------------------------------------------
        # Short-URL redirect — anything that looks like a 6-8 char alphanumeric
        # key gets forwarded to redirect-service.
        # The service itself issues 302 → long_url.
        # -----------------------------------------------------------------
        location ~ ^/([A-Za-z0-9_-]{4,12})$ {
            proxy_pass         http://redirect_service;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Allow redirect-service to issue 302; nginx should NOT follow it
            proxy_redirect     off;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        # -----------------------------------------------------------------
        # React SPA — serve static assets; fallback to index.html for
        # client-side routing (React Router / TanStack Router)
        # -----------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively (fingerprinted by build tool)
        location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # -----------------------------------------------------------------
        # Security headers
        # -----------------------------------------------------------------
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }
}
