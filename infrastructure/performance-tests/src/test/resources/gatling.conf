gatling {

  core {
    # Maximum duration for a simulation run (safety cap)
    maxDuration = 20 minutes

    # Encoding used throughout Gatling for scenario execution, log files, and reports
    encoding = "utf-8"

    # Simulation class to run when not specified on the command line
    # simulationClass = ""

    # Pause configuration
    pauses {
      # "disabled", "constant", "default" (use pause() values), "custom", "uniformPercentage", "normalWithStdDevDuration", "normalWithStdDevPercent"
      defaultPauseType = "disabled"
    }

    # Per-simulation run description — can be overridden via -rd on CLI
    runDescription = "URL Shortener Performance Test"
  }

  data {
    # Writers that will be used to output simulation data
    # console: prints summaries to stdout during the run
    # file:    writes raw simulation.log for report generation
    writers = [console, file]

    console {
      # Light (compact) summary or detailed
      light = false
      # How often (in seconds) to print the ongoing stats summary
      writePeriod = 5
    }

    file {
      # Buffer size for the async log writer (tune if you see dropped events under extreme load)
      bufferSize = 8192
    }
  }

  charting {
    # Maximum number of plot points on the HTML report charts (higher = finer resolution, slower report gen)
    maxPlotPerSeries = 1000

    # Indicator thresholds used on the HTML report pie charts — these align with project SLOs
    indicators {
      # Requests under lowerBound ms are shown as "OK" (green)
      lowerBound = 50       # p99 Bloom filter / cache-hit SLO

      # Requests between lowerBound and higherBound are "KO" (orange)
      higherBound = 200     # p99 redirect SLO (single-node)

      # Requests above higherBound are "Failed" (red)
      # (implicit: anything > higherBound)
    }
  }

  http {
    # Connection pool settings
    connectTimeout = 5000          # ms — fail fast if service is not reachable
    handshakeTimeout = 5000        # TLS handshake timeout (ms)

    pooledConnectionIdleTimeout = 60000   # ms — keep-alive idle timeout
    requestTimeout = 30000                # ms — per-request hard timeout

    # DNS resolution
    # "javaBuiltin" | "asyncDnsNameResolver" (Netty native, preferred for high concurrency)
    dnsNameResolution = asyncDnsNameResolver

    # How many times to try DNS resolution before failing
    maxDnsLookupTimeout = 5000     # ms

    # Enable Ahc (AsyncHttpClient) connection pooling
    enableHostnameVerification = false  # disable for self-signed certs in local/staging tests

    # Warm-up: pre-heat the connection pool before the load injection begins
    warmUp = "http://localhost:8080"
  }

  ssl {
    # Trust all certificates — useful for local / staging environments with self-signed certs
    useOpenSsl = true
    useOpenSslFinalizers = false
  }
}
