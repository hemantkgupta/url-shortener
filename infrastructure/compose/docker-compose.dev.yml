version: "3.9"

# =============================================================================
# URL Shortener — Full Local Development Stack
# =============================================================================
# Services: ScyllaDB, Redis (Stack), etcd, Kafka (KRaft), Kafka-UI,
#           ClickHouse, SigNoz OTel Collector, SigNoz Query, SigNoz Frontend
# =============================================================================

networks:
  url-shortener-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  scylla-data:
    driver: local
  redis-data:
    driver: local
  etcd-data:
    driver: local
  kafka-data:
    driver: local
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local
  signoz-data:
    driver: local

services:

  # ---------------------------------------------------------------------------
  # ScyllaDB — Primary datastore for URL mappings
  # ---------------------------------------------------------------------------
  scylladb:
    image: scylladb/scylla:6.1
    container_name: scylladb
    restart: unless-stopped
    command: >
      --smp 1
      --memory 512M
      --overprovisioned 1
      --developer-mode 1
      --broadcast-address scylladb
      --listen-address 0.0.0.0
      --broadcast-rpc-address scylladb
    ports:
      - "9042:9042"   # CQL native transport
      - "9160:9160"   # Thrift (legacy)
      - "10000:10000" # REST API
    volumes:
      - scylla-data:/var/lib/scylla
    networks:
      - url-shortener-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh --execute \"SELECT now() FROM system.local\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      - SCYLLA_JMX_REMOTE_PORT=7199

  # ---------------------------------------------------------------------------
  # Redis Stack — Cache layer + Bloom filter (RedisBloom) + RedisJSON
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # Redis protocol
      - "8001:8001"   # RedisInsight UI
    volumes:
      - redis-data:/data
    networks:
      - url-shortener-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning

  # ---------------------------------------------------------------------------
  # etcd — Distributed coordination for KGS (Key Generation Service)
  # ---------------------------------------------------------------------------
  etcd:
    image: bitnami/etcd:3.5
    container_name: etcd
    restart: unless-stopped
    ports:
      - "2379:2379"   # Client communication
      - "2380:2380"   # Peer communication
    volumes:
      - etcd-data:/bitnami/etcd
    networks:
      - url-shortener-net
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_NAME=etcd0
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=url-shortener-etcd-cluster
      - ETCD_DATA_DIR=/bitnami/etcd/data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Kafka — KRaft mode (no Zookeeper), event streaming
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # PLAINTEXT listener (external)
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - url-shortener-net
    environment:
      # KRaft cluster identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # Performance tuning for local dev
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      # Cluster ID (must be stable; generate once with: kafka-storage.sh random-uuid)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Kafka UI — Web console for Kafka topic/consumer-group inspection
  # Port 9080 (host) → 8080 (container) to avoid conflict with redirect-service
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "9080:8080"
    networks:
      - url-shortener-net
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      DYNAMIC_CONFIG_ENABLED: "true"

  # ---------------------------------------------------------------------------
  # ClickHouse — Analytics OLAP backend (also used by SigNoz)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP interface
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks:
      - url-shortener-net
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ---------------------------------------------------------------------------
  # SigNoz OTel Collector — Receives OTLP traces/metrics from all services
  # ---------------------------------------------------------------------------
  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.102.4
    container_name: signoz-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./signoz-otel-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - url-shortener-net
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=signoz_traces

  # ---------------------------------------------------------------------------
  # SigNoz Query Service — Backend API for the SigNoz frontend
  # ---------------------------------------------------------------------------
  signoz:
    image: signoz/query-service:0.53.1
    container_name: signoz
    restart: unless-stopped
    ports:
      - "8888:8888"   # SigNoz query API
      - "8080:8080"   # Internal query port
    volumes:
      - signoz-data:/var/lib/signoz
    networks:
      - url-shortener-net
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      ClickHouseUrl: tcp://clickhouse:9000
      STORAGE: clickhouse
      GODEBUG: netdns=go
      TELEMETRY_ENABLED: "true"
      DEPLOYMENT_TYPE: docker-standalone-amd
      SIGNOZ_LOCAL_DB_PATH: /var/lib/signoz/signoz.db
      DASHBOARDS_PATH: /root/config/dashboards
      STORAGE_PATH: /var/lib/signoz
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # SigNoz Frontend — Observability UI dashboard
  # ---------------------------------------------------------------------------
  signoz-frontend:
    image: signoz/frontend:0.53.1
    container_name: signoz-frontend
    restart: unless-stopped
    ports:
      - "3301:3301"
    networks:
      - url-shortener-net
    depends_on:
      signoz:
        condition: service_healthy
    environment:
      NGINX_CONFIG_ENVSUBST_ON_DEMAND: "true"
      FRONTEND_API_ENDPOINT: http://signoz:8080
